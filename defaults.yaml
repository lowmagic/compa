# compa's built-in defaults, in the engine's config schema, over the engine's
# base, whose house style and intentions for case comments this build keeps.
# A user's ~/.config/compa/config.yaml and --config each change only what
# they name.
apiVersion: compa.lowmag.cc/config/v1alpha1
kind: Config
companion:
  # The house section of the companion's prompt: who "support" is for this
  # build, the knowledge sources it has and its tools' conventions. The
  # engine's prompt names only roles. A user's configuration that names
  # house replaces this text whole.
  house: |
    "Support" and "the support organization" are the team working these cases. The engineer you pair with is one of its support engineers, and the customer is whoever reported the case.

    Knowledge sources: none is connected. No tool here searches or fetches a knowledge base or a ticket system, so an article or ticket that a comment cites is known only as far as the comment quotes it. Say that, and do not describe its content from memory as if it had been read.

    Tools: a case's artifacts are the files beside it, read with the built-in tools and the installed experts' tools. No binary is allowlisted by default, so `command` runs nothing until the user's configuration adds one, and no product CLI is assumed: give the customer only read-only commands that collect data, exactly as the case, an expert's guidance or a product document read in the conversation shows them.
reasoning:
  # No maxEgressClass: the engine's default, local_only, sends nothing to a
  # provider. A user who may send case data to one says so in their own
  # configuration (examples/config.yaml).
  # OpenRouter, through the engine's OpenAI-compatible provider, whose base
  # URL is OpenRouter's by default. The key is read from OPENROUTER_API_KEY
  # when a call is made, never from configuration. Cache marks are sent,
  # which OpenRouter passes to the models that take them.
  openai: {apiKeyEnv: OPENROUTER_API_KEY, cacheMarks: true}
  models:
    standard: {provider: vertex-gemini, model: gemini-3.8-flash, efforts: [low, medium, high]}
    lite: {provider: vertex-gemini, model: gemini-3.5-flash-lite, efforts: [minimal, low, medium, high]}
    sonnet: {provider: vertex-anthropic, model: claude-sonnet-4-6}
    # On OpenRouter; anthropic/claude-haiku-5.5 is the default model of the
    # engine's opt-in live test of the provider.
    haiku: {provider: openai, model: anthropic/claude-haiku-5.5}
  profiles:
    # The conversation and its consults, and the case ledger's reading of
    # the comments.
    companion: {model: standard, effort: medium}
    ledger: {model: standard, effort: medium}
    # The check of each answer before it is printed, and the second opinion
    # on /review.
    editor: {model: standard, effort: low}
    reviewer: {model: standard, effort: low}
