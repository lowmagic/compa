# compa's built-in defaults, in the engine's config schema. A user's
# ~/.config/compa/config.yaml and --config each change only what they name.
apiVersion: compa.lowmag.cc/config/v1alpha1
kind: Config
companion:
  # The house section of the companion's prompt: who "support" is for this
  # build, the knowledge sources it has and its tools' conventions. The
  # engine's prompt names only roles. A user's configuration that names
  # house replaces this text whole.
  house: |
    "Support" and "the support organization" are the team working these cases. The engineer you pair with is one of its support engineers, and the customer is whoever reported the case.

    Knowledge sources: none is connected. No tool here searches or fetches a knowledge base or a ticket system, so an article or ticket that a comment cites is known only as far as the comment quotes it. Say that, and do not describe its content from memory as if it had been read.

    Tools: a case's artifacts are the files beside it, read with the built-in tools and the installed experts' tools. No binary is allowlisted by default, so `command` runs nothing until the user's configuration adds one, and no product CLI is assumed: give the customer a product's commands as the case, an expert's guidance or the product's documentation shows them.
reasoning:
  # No maxEgressClass: the engine's default, local_only, sends nothing to a
  # provider. A user who may send case data to one says so in their own
  # configuration (examples/config.yaml).
  models:
    standard: {provider: vertex-gemini, model: gemini-3.8-flash, efforts: [low, medium, high]}
    lite: {provider: vertex-gemini, model: gemini-3.5-flash-lite, efforts: [minimal, low, medium, high]}
    sonnet: {provider: vertex-anthropic, model: claude-sonnet-4-6}
  profiles:
    # The conversation and its consults, and the case ledger's reading of
    # the comments.
    companion: {model: standard, effort: medium}
    ledger: {model: standard, effort: medium}
    # The check of each answer before it is printed, and the second opinion
    # on /review.
    editor: {model: standard, effort: low}
    reviewer: {model: standard, effort: low}
comments:
  style: >-
    Write as the support engineer working the case: plain, direct and
    courteous, in short paragraphs. Say what is established and what is not
    yet, and never state a guess as a finding. Put each command in its own
    fenced code block, exactly as it is to be run, and say what it changes;
    mark anything that restarts, deletes or cannot be undone, and say how to
    undo what can be. Ask for exactly what is needed and why. Do not mention
    internal tools, models or this analysis.
  intentions:
    - id: troubleshooting
      label: Troubleshooting steps
      audience: customer
      purpose: >-
        Give the customer the steps the investigation supports taking now,
        in order: first the read-only checks, then any changes, kept apart.
        Each step has its exact command and what it shows or changes; each
        change says how to check it worked and how to undo it.
    - id: request-data
      label: Request data
      audience: customer
      purpose: >-
        Ask for exactly what the open questions need: each command or
        capture, where to run it and how to attach the result, with why each
        is needed.
    - id: status-update
      label: Status update
      audience: customer
      purpose: >-
        Tell the customer where the investigation stands: what has been
        found and ruled out since support last wrote, what is being looked
        at next, and anything still needed from them.
    - id: internal-note
      label: Internal note
      audience: internal
      purpose: >-
        The findings so far for a colleague taking the case over: the
        problem in brief; what is established, with the evidence for each;
        what is ruled out and why; the leading explanation, if supported,
        its evidence and remaining uncertainty, and what would distinguish
        it from any material alternative; the next steps; and the questions
        still open.
